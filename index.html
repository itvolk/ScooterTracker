<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#888888">
    <link rel="manifest" href="/ScooterTracker/manifest.json">
    <title>Трекер электроскутера</title>
    <style>
        /* ===== БАЗОВЫЕ ПЕРЕМЕННЫЕ ===== */
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #0b1a33;
            --text-secondary: #5e6f8d;
            --border: #dce2ec;
            --input-bg: #fafcff;
            --shadow: 0 4px 12px rgba(0,0,0,0.06);
            --btn-primary: #3b82f6;
            --btn-success: #22c55e;
            --btn-danger: #ef4444;
            --btn-warning: #eab308;
            --battery-bg: #e2e8f0;
            --tab-active: #3b82f6;
            --tab-inactive: #94a3b8;
            --toast-bg: #1e293b;
            --toast-text: #f8fafc;
            --modal-overlay: rgba(0,0,0,0.5);
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #334155;
            --input-bg: #2d3a4f;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --btn-primary: #3b82f6;
            --btn-success: #22c55e;
            --btn-danger: #ef4444;
            --btn-warning: #eab308;
            --battery-bg: #334155;
            --tab-active: #60a5fa;
            --tab-inactive: #64748b;
            --toast-bg: #e2e8f0;
            --toast-text: #0f172a;
            --modal-overlay: rgba(0,0,0,0.7);
        }
        /* Плавный переход */
        body {
            transition: background 0.3s, color 0.3s;
        }
        .card, .tab-btn, .scooter-item, .stat-item, .battery-bar, .battery-fill, .btn, .charge-mode-toggle, .tariff-selector button, .charge-slider input[type="range"] {
            transition: background 0.3s, border-color 0.3s, color 0.3s, box-shadow 0.3s;
        }
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            max-width: 420px;
            margin: 0 auto;
            padding: 12px;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .header h1 {
            font-size: 20px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .theme-toggle:hover {
            background: var(--border);
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            background: var(--border);
            border-radius: 16px;
            padding: 4px;
            overflow-x: auto;
        }
        .tab-btn {
            flex: 0 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 8px;
            border: none;
            background: transparent;
            border-radius: 14px;
            font-weight: 600;
            color: var(--tab-inactive);
            cursor: pointer;
            transition: 0.2s;
            gap: 2px;
            min-height: 48px;
            white-space: nowrap;
        }
        .tab-btn .tab-icon {
            font-size: 18px;
            line-height: 1;
        }
        .tab-btn .tab-label {
            font-size: 10px;
            line-height: 1;
            letter-spacing: 0.3px;
        }
        .tab-btn.active {
            background: var(--card);
            color: var(--tab-active);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Стили для списка скутеров */
        .scooter-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 8px 0;
        }
        .scooter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--input-bg);
            border-radius: 14px;
            border: 2px solid var(--border);
            transition: 0.2s;
            cursor: pointer;
        }
        .scooter-item.active {
            border-color: var(--btn-primary);
            background: var(--card);
        }
        .scooter-item .scooter-info {
            flex: 1;
        }
        .scooter-item .scooter-name {
            font-weight: 600;
            font-size: 16px;
        }
        .scooter-item .scooter-stats {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .scooter-item .scooter-actions {
            display: flex;
            gap: 6px;
        }
        .scooter-item .scooter-actions button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .scooter-item .scooter-actions button:hover {
            background: var(--border);
        }
        .scooter-item .scooter-actions .delete-btn:hover {
            color: var(--btn-danger);
        }
        .scooter-actions .share-btn,
        .scooter-actions .import-btn {
            font-size: 18px;
        }
        .scooter-actions .share-btn:hover,
        .scooter-actions .import-btn:hover {
            background: var(--border);
        }
        .hidden-input {
            display: none;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .stat-item {
            background: var(--input-bg);
            border-radius: 14px;
            padding: 10px 4px;
            text-align: center;
        }
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .battery-wrap {
            margin: 10px 0 6px;
        }
        .battery-bar {
            height: 10px;
            background: var(--battery-bg);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
        }
        .battery-fill {
            height: 100%;
            background: #22c55e;
            border-radius: 10px;
            transition: width 0.3s;
            width: 100%;
        }
        .battery-fill.low {
            background: #ef4444;
        }
        .battery-fill.medium {
            background: #eab308;
        }
        .battery-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .input-group {
            margin: 10px 0;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-row input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            background: var(--input-bg);
            color: var(--text);
            transition: 0.2s;
            min-width: 0;
        }
        .input-row input:focus {
            border-color: var(--btn-primary);
        }
        .btn {
            padding: 10px 16px;
            background: var(--btn-primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-success {
            background: var(--btn-success);
        }
        .btn-danger {
            background: var(--btn-danger);
        }
        .btn-warning {
            background: var(--btn-warning);
            color: #0b1a33;
        }
        .btn-outline {
            background: transparent;
            color: var(--btn-primary);
            border: 2px solid var(--btn-primary);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }
        .flex {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .flex .btn {
            flex: 1;
        }
        .charge-mode-toggle {
            display: flex;
            gap: 6px;
            margin: 6px 0;
            background: var(--input-bg);
            border-radius: 14px;
            padding: 4px;
            border: 2px solid var(--border);
        }
        .charge-mode-toggle button {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 12px;
            background: transparent;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
        }
        .charge-mode-toggle button.active {
            background: var(--btn-primary);
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .tariff-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 6px 0;
        }
        .tariff-selector button {
            padding: 4px 12px;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1 0 auto;
        }
        .tariff-selector button.active {
            border-color: var(--btn-primary);
            background: var(--btn-primary);
            color: white;
        }
        .tariff-selector input {
            flex: 1;
            min-width: 60px;
            padding: 4px 8px;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
        }
        .tariff-selector input:focus {
            border-color: var(--btn-primary);
        }
        .to-indicator {
            background: var(--input-bg);
            border-radius: 14px;
            padding: 8px 14px;
            margin-top: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .to-indicator .to-label {
            color: var(--text-secondary);
        }
        .to-indicator .to-value {
            font-weight: 700;
        }
        .history {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 8px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .history-item .date {
            color: var(--text-secondary);
        }
        .history-item .km {
            font-weight: 600;
        }
        .history-item .correction {
            color: var(--btn-danger);
        }
        .empty {
            color: var(--text-secondary);
            text-align: center;
            padding: 12px;
        }
        .stats-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }
        .stats-controls select,
        .stats-controls input[type="number"] {
            padding: 6px 10px;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            flex: 1 0 auto;
        }
        .stats-controls select:focus,
        .stats-controls input:focus {
            border-color: var(--btn-primary);
        }
        .stats-controls .btn {
            flex: 0 1 auto;
            padding: 6px 12px;
            font-size: 13px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .stats-grid .stat-item {
            padding: 12px 4px;
        }
        .stats-grid .stat-value {
            font-size: 20px;
        }
        .stat-list .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            align-items: center;
        }
        .stat-list .stat-item .date {
            color: var(--text-secondary);
        }
        .stat-list .stat-item .dist {
            font-weight: 600;
        }
        .stat-list .stat-item .actions {
            display: flex;
            gap: 6px;
        }
        .stat-list .stat-item .actions button {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
        }
        .stat-list .stat-item .actions button:hover {
            opacity: 0.7;
        }
        .chart-container {
            margin: 12px 0;
            width: 100%;
            background: var(--input-bg);
            border-radius: 14px;
            padding: 8px;
            overflow-x: auto;
        }
        #statsChart,
        #chargeChart,
        #expenseChart {
            display: block;
            width: 100%;
            height: 160px;
            background: var(--input-bg);
            border-radius: 10px;
        }
        .settings-group {
            margin: 12px 0;
        }
        .settings-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .settings-group .hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .settings-group input,
        .settings-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .settings-group input:focus,
        .settings-group textarea:focus {
            border-color: var(--btn-primary);
        }
        .settings-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        /* Стили для выбора темы */
        .theme-selector {
            display: flex;
            gap: 8px;
            margin: 8px 0;
        }
        .theme-selector button {
            flex: 1;
            padding: 8px 4px;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .theme-selector button .theme-icon {
            font-size: 24px;
        }
        .theme-selector button .theme-label {
            font-size: 12px;
        }
        .theme-selector button.active {
            border-color: var(--btn-primary);
            background: var(--btn-primary);
            color: white;
        }
        .charge-slider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }
        .charge-slider input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: var(--border);
            border-radius: 6px;
            outline: none;
        }
        .charge-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--btn-primary);
            border-radius: 50%;
            cursor: pointer;
        }
        .charge-slider .charge-info {
            font-weight: 600;
            min-width: 70px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
        }
        .charge-slider .time-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0 4px;
        }
        .charge-slider .time-btn:hover {
            opacity: 0.7;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--card);
            border-radius: 28px;
            padding: 24px;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.25s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal h2 {
            margin: 0 0 16px;
            font-size: 20px;
            text-align: center;
        }
        .modal .input-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .modal .input-row>div {
            flex: 1;
            text-align: center;
        }
        .modal .input-row label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .modal .input-row input,
        .modal .input-row select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .modal .input-row input:focus,
        .modal .input-row select:focus {
            border-color: var(--btn-primary);
        }
        .modal .btn {
            width: 100%;
            padding: 12px;
            font-size: 17px;
            margin-top: 6px;
        }
        .modal .btn-outline {
            margin-top: 8px;
        }
        .settings-section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 16px 0 8px 0;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 4px;
        }
        .settings-section-title:first-of-type {
            margin-top: 0;
        }
        .date-select-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
        .date-select-group select {
            flex: 0 1 auto;
            min-width: 60px;
        }
        .date-select-group label {
            font-size: 13px;
            margin-right: 2px;
        }
        .release-notes {
            text-align: left;
            padding: 0;
            margin: 12px 0;
            list-style: none;
        }
        .release-notes li {
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        /* ===== АДАПТИВНОСТЬ ДЛЯ ГОРИЗОНТАЛЬНОЙ ОРИЕНТАЦИИ ===== */
        @media screen and (min-width: 500px) {
            body {
                max-width: 100%;
                padding: 16px 24px;
            }
            .tabs {
                gap: 8px;
                padding: 6px;
            }
            .tab-btn {
                padding: 8px 16px;
                min-height: 56px;
                flex: 1;
            }
            .tab-btn .tab-icon {
                font-size: 22px;
            }
            .tab-btn .tab-label {
                font-size: 12px;
            }
            .stat-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 12px;
            }
            .stat-item {
                padding: 14px 6px;
            }
            .stat-value {
                font-size: 26px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr 1fr 1fr;
                gap: 12px;
            }
            .stats-grid .stat-item {
                padding: 14px 6px;
            }
            .stats-grid .stat-value {
                font-size: 24px;
            }
            .tariff-selector {
                flex-wrap: nowrap;
                gap: 8px;
            }
            .tariff-selector button {
                flex: 1;
                padding: 6px 12px;
                font-size: 14px;
            }
            .tariff-selector input {
                min-width: 100px;
                font-size: 14px;
            }
            .charge-slider {
                gap: 16px;
            }
            .charge-slider .charge-info {
                min-width: 100px;
                font-size: 16px;
            }
            .input-row input {
                font-size: 18px;
                padding: 12px 16px;
            }
            .btn {
                font-size: 17px;
                padding: 12px 20px;
            }
            .btn-sm {
                font-size: 14px;
                padding: 8px 14px;
            }
            .header h1 {
                font-size: 24px;
            }
            .theme-toggle {
                font-size: 28px;
            }
            .card {
                padding: 20px;
                border-radius: 24px;
            }
            .modal {
                max-width: 480px;
                padding: 28px;
            }
            .modal h2 {
                font-size: 24px;
            }
            .modal .btn {
                font-size: 18px;
                padding: 14px;
            }
            .scooter-item {
                padding: 14px 18px;
            }
            .scooter-item .scooter-name {
                font-size: 18px;
            }
            .scooter-item .scooter-stats {
                font-size: 14px;
            }
            .scooter-item .scooter-actions button {
                font-size: 20px;
            }
            .history-item {
                font-size: 16px;
                padding: 8px 0;
            }
            .to-indicator {
                font-size: 16px;
                padding: 10px 18px;
            }
            .chart-container {
                padding: 12px;
            }
            #statsChart, #chargeChart, #expenseChart {
                height: 200px;
            }
